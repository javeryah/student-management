services:
  app:
    build: .
    ports:
      - "8000:80"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: students_db
      DB_USERNAME: students_user
      DB_PASSWORD: students_pass
      APP_KEY: "base64:35KeEjIpT8JyXX15zJ62H+qtrcw6JPWZ6aWEzvy4NDo="
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: students_db
      MYSQL_USER: students_user
      MYSQL_PASSWORD: students_pass
      MYSQL_ROOT_PASSWORD: root_pass_020
    volumes:
      - student_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_pass_020"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  student_db_data:
